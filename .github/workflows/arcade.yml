name: Generate contribution games

# Renders the contribution calendar as an animated Pac-Man game (SVG) and
# publishes it to the `output` branch, where the README picks it up:
#   https://raw.githubusercontent.com/Niklas-dev/Niklas-dev/output/pacman-contribution-graph.svg
#   https://raw.githubusercontent.com/Niklas-dev/Niklas-dev/output/pacman-contribution-graph-dark.svg
# Upstream: https://github.com/abozanona/pacman-contribution-graph

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
