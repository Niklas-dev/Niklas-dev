<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="bundestag-heckling-network: Who heckles whom in the Bundestag, 1949 to 2026: 836,570 interruptions as a directed network, normalised against expectation, tested against coalitions.">
<style><![CDATA[
text { font-family: 'Cascadia Code','JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .type { clip-path: none !important; }
  .fade, .in, .boot { opacity: 1 !important; }
}

.row { opacity: .22; animation: row 5.5s ease-in-out infinite; }
@keyframes row { 0% { opacity: .22; } 7% { opacity: 1; } 30% { opacity: .22; } 100% { opacity: .22; } }
.scan { animation: scan 5.5s linear infinite; }
