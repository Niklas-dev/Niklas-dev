<text x="20.0" y="32.0" font-size="15" fill="#e6e8eb" font-weight="700">look-and-mark</text>
<text x="420.0" y="31.0" font-size="10" fill="#00ff87" text-anchor="end">[public]</text>
<text x="20.0" y="60.0" font-size="10.5" fill="#c2c7cd">Realtime open-vocabulary detection and</text><text x="20.0" y="76.0" font-size="10.5" fill="#c2c7cd">segmentation on a webcam. A Claude agent</text><text x="20.0" y="92.0" font-size="10.5" fill="#c2c7cd">finds, marks and counts whatever you ask</text><text x="20.0" y="108.0" font-size="10.5" fill="#c2c7cd">for; classes are not fixed upfront.</text>
<text x="20.0" y="142.0" font-size="10" fill="#4f565e">computer vision · claude agent · tool use</text>
