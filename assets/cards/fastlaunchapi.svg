<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="FastLaunchAPI: Production-ready FastAPI starter: auth with email verification and social login, Stripe subscriptions, Celery, Docker, tests. An API ships in minutes.">
<style><![CDATA[
text { font-family: 'Cascadia Code','JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .type { clip-path: none !important; }
  .fade, .in, .boot { opacity: 1 !important; }
}

.row { opacity: .22; animation: row 5.5s ease-in-out infinite; }
@keyframes row { 0% { opacity: .22; } 7% { opacity: 1; } 30% { opacity: .22; } 100% { opacity: .22; } }
.scan { animation: scan 5.5s linear infinite; }
@keyframes scan { 0% { transform: translateY(0); opacity: 0; } 6% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(110px); opacity: 0; } }
.draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 6s ease-in-out infinite; }
@keyframes draw { 0% { stroke-dashoffset: 100; opacity: 1; } 45% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
.end { opacity: 0; animation: end 6s ease-in-out infinite; }
@keyframes end { 0%, 44% { opacity: 0; } 50%, 88% { opacity: 1; } 100% { opacity: 0; } }
.fill { transform-origin: 4px 0; transform: scaleX(0); animation: fill 1.8s cubic-bezier(.2,.7,.2,1) .4s forwards; }
@keyframes fill { to { transform: scaleX(.94); } }
.type { clip-path: inset(0 100% 0 0); animation-name: type; animation-timing-function: steps(var(--n), end); animation-fill-mode: forwards; }
@keyframes type { to { clip-path: inset(0 -2% 0 0); } }
.fade { opacity: 0; animation: fin .4s ease-out forwards; }
@keyframes fin { to { opacity: 1; } }
.drift { animation: drift 9s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(3px, -2px); } }
.mx { animation: mx 7s ease-in-out infinite; }
@keyframes mx { 0%, 100% { transform: translate(0,0); } 8% { transform: translate(0,-1.5px); } 16% { transform: translate(0,0); } }
.rec { animation: rec 2.4s ease-in-out infinite; }
@keyframes rec { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.track { animation: track 4s ease-in-out infinite alternate; }
@keyframes track { to { transform: translate(5px, 3px); } }
.led { animation: led 3.4s ease-in-out infinite; }
@keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
.msg { animation: msg 3.2s linear infinite; }
@keyframes msg { 0% { transform: translateX(8px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(112px); opacity: 0; } }
]]></style>

<rect x=".5" y=".5" width="439" height="199" rx="8" fill="#090b0d" stroke="#1c2126"/>
<text x="20.0" y="32.0" font-size="15" fill="#e6e8eb" font-weight="700">FastLaunchAPI</text>
<text x="420.0" y="31.0" font-size="10" fill="#e6e8eb" text-anchor="end">[product]</text>
<text x="20.0" y="60.0" font-size="10.5" fill="#c2c7cd">Production-ready FastAPI starter: auth</text><text x="20.0" y="76.0" font-size="10.5" fill="#c2c7cd">with email verification and social login,</text><text x="20.0" y="92.0" font-size="10.5" fill="#c2c7cd">Stripe subscriptions, Celery, Docker,</text><text x="20.0" y="108.0" font-size="10.5" fill="#c2c7cd">tests. An API ships in minutes.</text>
<text x="20.0" y="142.0" font-size="10" fill="#4f565e">fastapi · postgres · stripe · docker</text>
<path d="M20 160H278" stroke="#1c2126"/>
<text x="20.0" y="181.0" font-size="10.5" fill="#00ff87">&gt; ~1M views across the launch videos</text>
<path d="M296 20V180" stroke="#1c2126"/>
<g transform="translate(306,36)"><text x="4.0" y="20.0" font-size="10" xml:space="preserve"><tspan fill="#00ff87">$ </tspan><tspan fill="#e6e8eb">fastlaunch deploy</tspan></text><text x="4.0" y="44.0" font-size="10" fill="#4f565e">[░░░░░░░░░░░░░░]</text><g class="type" style="--n:14;animation-delay:.6s;animation-duration:1.4s"><text x="4.0" y="44.0" font-size="10" fill="#e6e8eb">[██████████████]</text></g><text class="fade" x="4.0" y="68.0" font-size="9.5" fill="#8a9099" style="animation-delay:1.30s">auth      ok</text><text class="fade" x="4.0" y="84.0" font-size="9.5" fill="#8a9099" style="animation-delay:1.70s">stripe    ok</text><text class="fade" x="4.0" y="100.0" font-size="9.5" fill="#8a9099" style="animation-delay:2.10s">docker    ok</text><text class="fade" x="4.0" y="114.0" font-size="9.5" fill="#00ff87" font-weight="700" style="animation-delay:2.50s">live in 10 min</text></g>

</svg>
