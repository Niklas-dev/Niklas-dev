<text x="20.0" y="32.0" font-size="15" fill="#e6e8eb" font-weight="700">tessera</text>
<text x="420.0" y="31.0" font-size="10" fill="#00ff87" text-anchor="end">[public]</text>
<text x="20.0" y="60.0" font-size="10.5" fill="#c2c7cd">Finds the cryptography hiding in a stack:</text><text x="20.0" y="76.0" font-size="10.5" fill="#c2c7cd">source, dependency manifests, X.509</text><text x="20.0" y="92.0" font-size="10.5" fill="#c2c7cd">certs and live TLS endpoints. Emits a</text><text x="20.0" y="108.0" font-size="10.5" fill="#c2c7cd">CBOM with a quantum-risk rating per asset.</text>
<text x="20.0" y="142.0" font-size="10" fill="#4f565e">rust · next.js · cyclonedx · nist pqc</text>
